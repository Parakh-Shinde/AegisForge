services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegisforge
      POSTGRES_USER: aegisforge
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aegisforge-postgres:/var/lib/postgresql/data

volumes:
  aegisforge-postgres:

