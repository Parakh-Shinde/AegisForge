[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisforge"
version = "0.7.0"
description = "Lab-safe AI/API adversary emulation and detection validation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "anyio>=4,<4.15",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
aegisforge = "aegisforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisforge"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
