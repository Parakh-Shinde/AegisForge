[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisforge"
version = "0.9.0"
description = "Lab-safe AI/API adversary emulation and detection-validation platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  {name = "Parakh Shinde"},
]
keywords = [
  "ai-security",
  "api-security",
  "detection-engineering",
  "prompt-injection",
  "purple-team",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "anyio>=4.10,<4.15",
  "fastapi>=0.141.1,<1",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/Parakh-Shinde/AegisForge"
Documentation = "https://github.com/Parakh-Shinde/AegisForge/tree/main/docs"
Issues = "https://github.com/Parakh-Shinde/AegisForge/issues"
Releases = "https://github.com/Parakh-Shinde/AegisForge/releases"
Source = "https://github.com/Parakh-Shinde/AegisForge"

[project.scripts]
aegisforge = "aegisforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisforge"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
