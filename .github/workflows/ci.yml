name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests with warnings treated as errors
        run: python -m pytest -W error

      - name: Generate regression benchmark reports
        run: |
          mkdir -p reports
          aegisforge guard-benchmark
          aegisforge challenge-benchmark
          aegisforge hybrid-benchmark

      - name: Enforce benchmark quality thresholds
        run: aegisforge benchmark-gate | tee reports/quality-gate.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-evidence-python-${{ matrix.python-version }}
          path: |
            reports/guard-benchmark.json
            reports/guard-benchmark.md
            reports/challenge-benchmark.json
            reports/challenge-benchmark.md
            reports/hybrid-benchmark.json
            reports/hybrid-benchmark.md
            reports/quality-gate.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify installed CLI
        run: aegisforge doctor
