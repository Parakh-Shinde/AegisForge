name: Dependency Security

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/security.yml
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/security.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build isolated audit environment
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip
          .audit-venv/bin/python -m pip install .

      - name: Audit installed production dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          virtual-environment: .audit-venv/
          local: true
          summary: true
