name: Bug report
description: Report a reproducible defect in AegisForge
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use private vulnerability reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic data and an authorized local lab.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AegisForge version
      placeholder: "0.8.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and relevant local-model version.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs, reports, or screenshots. Never include secrets or personal data.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I used only synthetic data and systems I own or am authorized to test.
          required: true
